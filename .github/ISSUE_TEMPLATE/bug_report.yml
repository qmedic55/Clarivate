name: Bug Report
description: Something isn't working as expected. Help us understand and fix it.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Clear bug reports help us ship fixes faster.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug in plain language. What did you see?
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What should have happened?
      description: Describe the behavior you expected to see.
      placeholder: What was the correct outcome?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Walk us through exactly how to see this bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See the error
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How severe is this?
      options:
        - "Blocker: can't use the product at all"
        - "Major: key functionality is broken"
        - "Minor: annoying but I can work around it"
        - "Cosmetic: looks wrong but works fine"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, or any other relevant context.
      placeholder: e.g. Chrome 120, macOS Sonoma, iPhone 15
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: If applicable, add screenshots or screen recordings to help explain the problem.
    validations:
      required: false
